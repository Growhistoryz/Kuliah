<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Belajar Javascript Platform</title>
  </head>
  <body>
    <h1>Belajar JavaScript</h1>
    <!-- Ini buat tombol kalaau di klik manggil method tampilakanNama() -->
    <button onclick="tampilakanNama()">KLIK SAYA BRO</button>
    <div id="hasil"></div>
    <script>
      // buat method yang menghasilkan kalimat
      function tampilakanNama() {
        document.getElementById("hasil").innerHTML =
          "<h3> Nama saya adalah Andi";
      }
    </script>
  </body>
</html>
