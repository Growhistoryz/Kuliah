<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Belajar Javascript Platform</title>
  </head>
  <body>
    <h1>Belajar JavaScript</h1>
    <div id="hasil"></div>
    <script>
      // Memebuat Method dengan nama tampilkanNama dan cetak kalimat USD
      function tampilkanNama() {
        return " Universitas Sanata Dharma";
      }
      // Memanggilkan Method tadi yang kita buat
      document.getElementById("hasil").innerHTML = tampilkanNama();
    </script>
  </body>
</html>
