<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Belajar Javascript Platform</title>
  </head>
  <body>
    <h1>Belajar JavaScript</h1>
   
    <div id="hasil"></div> 

    <script>
        var warna = "merah";
        var teks;

        // di sini kita akan menggunakan Jika Maka.karena di sini warna isinya merah maka mencetak kasus yang merah.
        switch (warna) {
            case "hitam":
                teks = "Warna hitam";
                break;

            case "merah":
                teks = "Warna merah";
                break; 

            case "hijau":
                teks = "Warna hijau";
                break; 

            default:
                teks = "Gak ada warnanya yang ke detect";
        }

        document.getElementById("hasil").innerHTML = teks;
    </script>

  </body>
</html>
